<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 폰트 대문자 A-Z 테스트 (커서 추가)</title>
    
    <style>
        /* (기존 스타일 유지) */
        body {
            background-color: rgb(28, 65, 166);
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            outline: none; 
            tabindex: 0;
            overflow: hidden; 
        }

        .container {
            width: 80vw; 
            max-width: 80vw;
            padding: 10px;
            overflow-wrap: break-word; 
        }

        /* 폰트 로드: 네가 알려준 파일명과 웨이트로 정의함 */
        @font-face {
            font-family: 'Domino'; 
            src: url('domino-light.woff2') format('woff2');
            font-weight: 300; 
        }
        @font-face {
            font-family: 'Domino'; 
            src: url('domino-regular.woff2') format('woff2');
            font-weight: 400; 
        }
        @font-face {
            font-family: 'Domino'; 
            src: url('domino-medium.woff2') format('woff2');
            font-weight: 500; 
        }
        @font-face {
            font-family: 'Domino'; 
            src: url('domino-bold.woff2') format('woff2');
            font-weight: 700; 
        }

        .font-random {
            font-family: 'Domino', sans-serif; 
            line-height: 0.7; 
            word-wrap: break-word;
            text-align: center; 
        }

        #outputArea {
            font-size: 30vh; 
            padding: 0;
            tabindex: -1; 
            white-space: pre-wrap; 
            color: #333; 
            min-height: 25vh; 
        }

        /* 개별 글자 스타일 */
        .char-span {
            display: inline-block;
            transition: color 0.3s, font-weight 0.3s; 
        }

        /* 상단 고정 안내 문구 스타일 */
        #top-guide-message {
            position: fixed; 
            top: 20px; 
            left: 50%;
            transform: translateX(-50%); 
            font-size: 1.5vh; 
            color: #e0e0e070;
            font-family: sans-serif;
            z-index: 100; 
            padding: 5px 10px;
            background-color: rgba(255, 255, 255,0);
            border-radius: 5px;
        }

        /* 👇 **깜빡이는 커서 스타일** */
        .blinking-cursor {
            display: inline-block;
            width: 3px; /* 커서 두께 */
            height: 0.7em; /* 커서 높이는 현재 폰트 크기와 동일하게 */
            background-color: #ededed;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s step-end infinite; /* 1초 간격으로 깜빡임 */
        }

        /* 👇 **깜빡이는 CSS 애니메이션 정의** */
        @keyframes blink {
            from, to { visibility: visible; }
            50% { visibility: hidden; }
        }

        /* (기존 CSS 스타일 유지) */

        /* 👇 **수정!:** Montserrat 폰트 로드 코드를 추가하세요 */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
            
        /* (기존 @font-face 블록 등 유지) */

      
    </style>
</head>
<body id="pageBody"> 

    <div id="top-guide-message">
    입력해보세요.
    </div>

    <div class="container">
        <div id="outputArea" class="font-random">
            </div>
    </div>

<script>
    let prevWeight = null;
    let prevColor = null;

    const outputArea = document.getElementById('outputArea');
    let typedText = ''; 
    
    // 웨이트 풀 및 색상 정의는 이전과 동일
    const WEIGHT_POOL = [
        700, 700, 700, 700, // Bold (40%)
        500, 500, 500,       // Medium (30%)
        400, 400,            // Regular (20%)
        300                  // Light (10%)
    ];
    const MAX_HEIGHT_RATIO = 0.75; 
    const FIXED_COLORS = ['#ffffff', '#85d0f4', '#e95383', '#fffcd3']; 

    // 상단 안내 메시지를 중앙 플레이스홀더와 분리하기 위해 별도의 상수 정의
    const TOP_GUIDE_MESSAGE = "Type here...";

    function getRandomStyledSpan(text, isGuide = false) {
        const charSpan = document.createElement('span');
        charSpan.textContent = text === ' ' ? '\u00A0' : text; 
        charSpan.className = 'char-span';
        
        if (!isGuide) {
            // 무게(weight) 중복 방지
            let randomWeight;
            do {
                randomWeight = WEIGHT_POOL[Math.floor(Math.random() * WEIGHT_POOL.length)];
            } while (randomWeight === prevWeight);
            prevWeight = randomWeight;

            // 색상(color) 중복 방지
            let randomColor;
            do {
                randomColor = FIXED_COLORS[Math.floor(Math.random() * FIXED_COLORS.length)];
            } while (randomColor === prevColor);
            prevColor = randomColor;

            charSpan.style.fontWeight = randomWeight;
            charSpan.style.color = randomColor;
        }

        return charSpan;
    }


        function renderText() {
        outputArea.innerHTML = ''; 

        if (typedText.length === 0) {
            const cursor = document.createElement('span');
            cursor.className = 'blinking-cursor';
            outputArea.appendChild(cursor);
            
            const placeholderSpan = document.createElement('span');
            placeholderSpan.textContent = "TYPE HERE"; 
            
            // 3. 플레이스홀더 스타일 (폰트 변경 및 크기 조정)
            placeholderSpan.style.color = '#fff'; 
            placeholderSpan.style.opacity = '0.15';
            placeholderSpan.style.fontWeight = '400'; 
            placeholderSpan.style.fontSize = '18vh'; 
            
            // 👇 **수정!:** Google Sans Flex 대신 Montserrat 적용
            placeholderSpan.style.fontFamily = 'Montserrat, sans-serif'; 
            
            outputArea.appendChild(placeholderSpan);
            
            return;
        }
        // 👆 **텍스트가 있으면 플레이스홀더는 자동으로 사라짐**
        
       // 실제 타이핑된 텍스트 렌더링
        Array.from(typedText).forEach(char => {
            if (char === '\n') {
                outputArea.appendChild(document.createElement('br'));
                return;
            }
            outputArea.appendChild(getRandomStyledSpan(char));
        });
        
        const cursor = document.createElement('span');
        cursor.className = 'blinking-cursor';
        outputArea.appendChild(cursor);

        // 넘침 감지 로직
        const viewportHeight = window.innerHeight; 
        const currentContentHeight = outputArea.offsetHeight; 
        
        if (currentContentHeight > (viewportHeight * MAX_HEIGHT_RATIO)) {
            typedText = ''; 
            renderText();
            return; 
        }
    }

    document.addEventListener('keydown', (event) => {
        event.preventDefault(); 
        
        const key = event.key;
        const code = event.code;
        
        let charToAdd = null;
        let shouldRender = false;

        // 1. BackSpace 처리
        if (key === 'Backspace') {
            typedText = typedText.slice(0, -1);
            shouldRender = true;
        }
        
        // 2. 알파벳 키 (A-Z) 허용
        else if (code.startsWith('Key') && code.length === 4) {
            charToAdd = code.slice(3, 4);
            shouldRender = true;
        
        // 3. Enter 키 허용
        } else if (key === 'Enter') {
            charToAdd = '\n';
            shouldRender = true;
        
        // 4. 스페이스바 허용 (단, 첫 글자는 막음)
        } else if (key === ' ') {
            const lastNewLineIndex = typedText.lastIndexOf('\n');
            const currentLine = typedText.substring(lastNewLineIndex + 1);

            if (currentLine.trim().length === 0) {
                shouldRender = false;
            } else {
                charToAdd = ' ';
                shouldRender = true;
            }
        
        } else {
            shouldRender = false;
        }


        if (charToAdd !== null) {
            typedText += charToAdd;
        }
        
        if (shouldRender) {
            renderText();
        }
    });

    window.onload = () => {
        document.getElementById('pageBody').focus();
        renderText();
        
        // 👇 **상단 안내 메시지 수정 (중복 방지)**
        //const topGuide = document.getElementById('top-guide-message');
        //topGuide.textContent = "A-Z, ENTER, SPACE (75% 넘침 시 초기화)";
    };

</script>

</body>
</html>
